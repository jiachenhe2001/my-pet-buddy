<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>小黑 · 桌宠控制台</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <div><h1>桌宠控制台</h1><p class="subtitle">陪你工作，也陪你发呆</p></div>
        <div class="header-actions">
            <a id="website-link" href="https://github.com/jiachenhe2001/my-pet-buddy" target="_blank" rel="noopener noreferrer" class="icon-button" title="项目仓库" aria-label="打开项目仓库">↗</a>
            <button id="theme-toggle" class="icon-button" type="button" title="切换主题" aria-label="切换明暗主题"><span id="theme-toggle-icon" aria-hidden="true">☾</span></button>
            <button type="button" class="my-pet-toggle" id="my-pet-toggle" role="switch" aria-checked="true" aria-label="显示桌宠"></button>
        </div>
    </header>
    <main>
        <div class="character-control"><label for="pet-selection">桌宠形象</label><select id="pet-selection" aria-label="桌宠形象"></select></div>
        <section class="observer-panel" id="observer-panel" aria-label="动态桌宠设置">
            <div class="observer-heading"><h2 id="pet-name">小黑</h2><span class="badge">动态桌宠</span></div>
            <div class="observer-preview"><canvas id="observer-preview" aria-label="动作预览" role="img"></canvas></div>
            <div class="observer-actions" id="pet-actions" role="group" aria-label="动作选择"></div>
            <label class="observer-size">大小 <input id="observer-size" type="range" min="80" max="180" step="10" value="120"><output id="observer-size-value" for="observer-size">120</output></label>
            <div class="observer-bottom">
                <label><input id="observer-paused" type="checkbox">暂停动画</label>
                <button class="observer-reset" id="observer-reset" type="button">重置位置</button>
            </div>
            <p class="observer-help observer-error" id="observer-error" role="status" hidden></p>
        </section>
        <p class="observer-help">单击蹦跶，拖动调整位置，右键打开动作菜单。<br>支持普通网页；安装或更新后请刷新网页。</p>
    </main>
    <script src="pets.js"></script>
    <script src="observer.js"></script>
    <script src="popup-controller.js"></script>
    <script src="popup.js"></script>
</body>
</html>
