<body><main><h1>隐私说明</h1><p>桌宠无需账号，动画素材随项目提供，不向项目服务端上传浏览内容或设置。</p>
<p>Chrome 扩展使用 storage 权限保存形象、动作、大小、暂停、位置和主题；启用 Chrome 同步时，这些设置可随浏览器账号同步。内容脚本在网页中绘制桌宠并处理互动。</p>
<p>桌面版在本机保存设置，不自动检查更新，安装后可断网运行。项目链接由用户点击后在浏览器打开。</p>
