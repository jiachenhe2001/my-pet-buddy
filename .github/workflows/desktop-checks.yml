name: Desktop checks

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'observer.js'
      - 'pets/**'
      - 'icons/**'
      - 'package*.json'
      - 'test/desktop.cjs'
      - 'test/fixtures/**'
      - '.github/workflows/desktop-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - run: npx playwright install-deps chromium
      - run: xvfb-run --auto-servernum npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: test-results/desktop/
          if-no-files-found: ignore
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: desktop-mac
            file: desktop/release/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: desktop-windows
            file: desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error
