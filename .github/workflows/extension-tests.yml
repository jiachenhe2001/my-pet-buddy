name: Chrome extension checks

on:
  pull_request:
    paths:
      - '*.js'
      - 'popup.html'
      - 'popup.css'
      - 'manifest.json'
      - 'package*.json'
      - 'pets/**'
      - 'test/**'
      - '.github/workflows/extension-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-screenshots
          path: test-results/
          if-no-files-found: ignore

