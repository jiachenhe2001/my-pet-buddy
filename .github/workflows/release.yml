name: Publish version

on:
  push:
    branches: [main]
    paths: ['manifest.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e 'const fs=require("fs"); const paths=["manifest.json","package.json","package-lock.json","desktop/package.json","desktop/package-lock.json"]; const data=paths.map(p=>JSON.parse(fs.readFileSync(p))); const version=data[0].version; if(!/^\d+\.\d+\.\d+$/.test(version)||data.some(d=>d.version!==version)||data.filter(d=>d.packages).some(d=>d.packages[""].version!==version)) process.exit(1); process.stdout.write(version)')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"v$VERSION\" and .draft == false) | .id")
          if [ -n "$EXISTING" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  extension:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/package-extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-chrome
          path: release/*.zip
          if-no-files-found: error

  electron:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - run: npx playwright install-deps chromium
      - run: xvfb-run --auto-servernum npm run test:desktop

  desktop:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: release-macos
            file: desktop/release/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: release-windows
            file: desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  publish:
    needs: [prepare, extension, electron, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -s "release-assets/my-pet-buddy-chrome-$VERSION.zip"
          test -s "release-assets/MyPetBuddy-Setup-$VERSION.exe"
          test -s "release-assets/MyPetBuddy-$VERSION-universal.dmg"
          (cd release-assets && sha256sum *.zip *.exe *.dmg > SHA256SUMS.txt)
          TAG="v$VERSION"
          if gh release view "$TAG" --json isDraft --jq .isDraft > release-draft.txt 2>/dev/null; then
            test "$(cat release-draft.txt)" = true
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --draft --title "小黑桌宠 $TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release edit "$TAG" --draft=false --latest
