name: Publish version

on:
  push:
    branches: [main]
    paths: ['manifest.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      reuse_run: ${{ steps.installers.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e 'const fs=require("fs"); const paths=["manifest.json","package.json","package-lock.json","desktop/package.json","desktop/package-lock.json"]; const data=paths.map(p=>JSON.parse(fs.readFileSync(p))); const version=data[0].version; if(!/^\d+\.\d+\.\d+$/.test(version)||data.some(d=>d.version!==version)||data.filter(d=>d.packages).some(d=>d.packages[""].version!==version)) process.exit(1); process.stdout.write(version)')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"v$VERSION\" and .draft == false) | .id")
          if [ -n "$EXISTING" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find source-matched checked installers
        id: installers
        if: steps.version.outputs.publish == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            core.setOutput('reuse_run', '');
            try {
              const current = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
              const currentTree = (await github.rest.git.getTree({ owner, repo, tree_sha: current.data.tree.sha, recursive: '1' })).data;
              // Compare every tracked source/config file except this release orchestration.
              const sources = tree => JSON.stringify(tree.tree
                .filter(entry => entry.type !== 'tree' && entry.path !== '.github/workflows/release.yml')
                .map(entry => [entry.path, entry.mode, entry.type, entry.sha])
                .sort((left, right) => left[0].localeCompare(right[0])));
              if (currentTree.truncated) throw new Error('Source tree was truncated');
              const currentSources = sources(currentTree);
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'desktop-checks.yml', event: 'pull_request', status: 'success', per_page: 20
              });
              for (const run of runs.data.workflow_runs) {
                if (run.conclusion !== 'success' || run.head_repository?.full_name !== owner + '/' + repo) continue;
                const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: run.head_sha });
                const tree = (await github.rest.git.getTree({ owner, repo, tree_sha: commit.data.tree.sha, recursive: '1' })).data;
                if (tree.truncated || sources(tree) !== currentSources) continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { owner, repo, run_id: run.id, per_page: 100 });
                if (!['desktop-mac', 'desktop-windows'].every(name => artifacts.some(artifact => artifact.name === name && !artifact.expired))) continue;
                core.setOutput('reuse_run', String(run.id));
                core.info('Reusing checked installers from run ' + run.id + ' at ' + run.head_sha + '; source files match this release.');
                break;
              }
            } catch (error) {
              core.warning('Checked installer reuse unavailable; building fresh installers. ' + error.message);
            }

  extension:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/package-extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-chrome
          path: release/*.zip
          if-no-files-found: error

  electron:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - run: npx playwright install-deps chromium
      - run: xvfb-run --auto-servernum npm run test:desktop

  desktop:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            script: dist:mac
            artifact: release-macos
            reuse_artifact: desktop-mac
            file: desktop/release/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: release-windows
            reuse_artifact: desktop-windows
            file: desktop/release/*.exe
    runs-on: ${{ needs.prepare.outputs.reuse_run != '' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download checked source-matched installer
        if: needs.prepare.outputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.reuse_run }}
          name: ${{ matrix.reuse_artifact }}
          path: desktop/release
      - uses: actions/setup-node@v4
        if: needs.prepare.outputs.reuse_run == ''
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        if: needs.prepare.outputs.reuse_run == ''
        working-directory: desktop
      - run: npm test
        if: needs.prepare.outputs.reuse_run == ''
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        if: needs.prepare.outputs.reuse_run == ''
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  publish:
    needs: [prepare, extension, electron, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -s "release-assets/my-pet-buddy-chrome-$VERSION.zip"
          test -s "release-assets/MyPetBuddy-Setup-$VERSION.exe"
          test -s "release-assets/MyPetBuddy-$VERSION-universal.dmg"
          (cd release-assets && sha256sum *.zip *.exe *.dmg > SHA256SUMS.txt)
          TAG="v$VERSION"
          if gh release view "$TAG" --json isDraft --jq .isDraft > release-draft.txt 2>/dev/null; then
            test "$(cat release-draft.txt)" = true
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --draft --title "小黑桌宠 $TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release edit "$TAG" --draft=false --latest
